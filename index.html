<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>CloudPlay</title>
  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: radial-gradient(circle at 30% 20%, #1b2340 0%, #0a0d1a 70%);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

header { padding: 60px 100px 20px; }
header h1 { font-size: 72px; letter-spacing: 2px; direction: ltr; text-align: left; }
header h1 span { color: #4ade80; }
header p { margin-top: 10px; font-size: 28px; color: #9aa4c7; }

#grid {
  display: grid;
  grid-template-columns: repeat(4, 380px);
  gap: 40px;
  padding: 40px 100px;
  direction: ltr;
}

.tile {
  height: 260px;
  border-radius: 24px;
  background: #151b33;
  border: 6px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
}
.tile .logo {
  width: 120px; height: 120px;
  border-radius: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px; font-weight: bold;
}
.tile .name { font-size: 34px; }
.tile .sub { font-size: 22px; color: #8c96ba; margin-top: -10px; }
.tile.focused {
  transform: scale(1.08);
  border-color: #4ade80;
  box-shadow: 0 0 40px rgba(74, 222, 128, 0.45);
}

footer {
  position: absolute;
  bottom: 40px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 50px;
  font-size: 24px; color: #7d87ad;
}

#dialog {
  position: absolute; inset: 0;
  background: rgba(0, 0, 0, 0.8);
  display: flex; align-items: center; justify-content: center;
}
#dialog.hidden { display: none; }
#dialog .box {
  width: 900px; padding: 50px;
  background: #151b33; border-radius: 28px;
}
#dialog h2 { font-size: 40px; margin-bottom: 30px; }
#dialog label { display: block; font-size: 26px; margin: 20px 0 8px; color: #9aa4c7; }
#dialog input {
  width: 100%; padding: 18px; font-size: 30px;
  border-radius: 14px; border: 4px solid #2a3358;
  background: #0d1124; color: #fff;
}
#dialog input:focus, #dialog button.focused, #dialog input.focused {
  border-color: #4ade80; outline: none;
}
#dialog .row { display: flex; gap: 20px; margin-top: 36px; }
#dialog button {
  flex: 1; padding: 20px; font-size: 30px; border-radius: 14px;
  border: 4px solid transparent; background: #2a3358; color: #fff;
}
#dialog button.focused { background: #1f7a45; }

</style>
</head>
<body>
  <header>
    <h1>Cloud<span>Play</span></h1>
    <p>ختار الخدمة بالسهام وكليك على OK</p>
  </header>

  <main id="grid"></main>

  <div id="dialog" class="hidden">
    <div class="box">
      <h2>زيد خدمة جديدة</h2>
      <label>السمية</label>
      <input id="in-name" type="text" placeholder="مثلا: PS Remote">
      <label>الرابط</label>
      <input id="in-url" type="url" placeholder="https://..." dir="ltr">
      <div class="row">
        <button id="btn-save" class="focusable">حفظ</button>
        <button id="btn-cancel" class="focusable">إلغاء</button>
      </div>
    </div>
  </div>

  <footer>
    <span>⬅➡⬆⬇ تنقل</span>
    <span>OK فتح</span>
    <span>Return خروج</span>
    <span>أزرق: مسح الخدمة المضافة</span>
  </footer>

  <script>
/* CloudPlay - Tizen TV launcher for cloud gaming services */
(function () {
  'use strict';

  var COLS = 4;
  var STORAGE_KEY = 'cloudplay_custom';

  var BUILTIN = [
    { name: 'Xbox Cloud Gaming', sub: 'Game Pass', url: 'https://www.xbox.com/play', color: '#107c10', letter: 'X' },
    { name: 'GeForce NOW', sub: 'NVIDIA', url: 'https://play.geforcenow.com', color: '#76b900', letter: 'G' },
    { name: 'Amazon Luna', sub: 'Amazon', url: 'https://luna.amazon.com', color: '#6b3fd4', letter: 'L' },
    { name: 'Boosteroid', sub: 'Cloud PC', url: 'https://cloud.boosteroid.com', color: '#0e7be0', letter: 'B' }
  ];

  var items = [];
  var focusIndex = 0;
  var dialogOpen = false;
  var dialogFocus = 0; // 0 name, 1 url, 2 save, 3 cancel

  var grid = document.getElementById('grid');
  var dialog = document.getElementById('dialog');
  var inName = document.getElementById('in-name');
  var inUrl = document.getElementById('in-url');
  var btnSave = document.getElementById('btn-save');
  var btnCancel = document.getElementById('btn-cancel');

  function loadCustom() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveCustom(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) { /* ignore */ }
  }

  function buildItems() {
    items = BUILTIN.slice();
    var custom = loadCustom();
    for (var i = 0; i < custom.length; i++) {
      items.push({
        name: custom[i].name,
        sub: 'مضافة',
        url: custom[i].url,
        color: '#c2410c',
        letter: (custom[i].name || '?').charAt(0).toUpperCase(),
        custom: true,
        customIndex: i
      });
    }
    items.push({ name: 'زيد خدمة', sub: '', url: null, color: '#334155', letter: '+', add: true });
  }

  function render() {
    buildItems();
    grid.innerHTML = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var tile = document.createElement('div');
      tile.className = 'tile';
      tile.innerHTML =
        '<div class="logo" style="background:' + it.color + '">' + escapeHtml(it.letter) + '</div>' +
        '<div class="name">' + escapeHtml(it.name) + '</div>' +
        '<div class="sub">' + escapeHtml(it.sub) + '</div>';
      grid.appendChild(tile);
    }
    if (focusIndex >= items.length) focusIndex = items.length - 1;
    updateFocus();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function updateFocus() {
    var tiles = grid.children;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].classList.toggle('focused', i === focusIndex);
    }
  }

  function move(dx, dy) {
    var next = focusIndex + dx + dy * COLS;
    if (dx !== 0) {
      var row = Math.floor(focusIndex / COLS);
      if (Math.floor(next / COLS) !== row) return;
    }
    if (next < 0 || next >= items.length) return;
    focusIndex = next;
    updateFocus();
  }

  function openItem() {
    var it = items[focusIndex];
    if (!it) return;
    if (it.add) {
      openDialog();
    } else {
      window.location.href = it.url;
    }
  }

  function removeCurrent() {
    var it = items[focusIndex];
    if (!it || !it.custom) return;
    var list = loadCustom();
    list.splice(it.customIndex, 1);
    saveCustom(list);
    render();
  }

  /* ---------- dialog ---------- */
  function openDialog() {
    dialogOpen = true;
    inName.value = '';
    inUrl.value = 'https://';
    dialog.classList.remove('hidden');
    setDialogFocus(0);
  }

  function closeDialog() {
    dialogOpen = false;
    dialog.classList.add('hidden');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function setDialogFocus(i) {
    dialogFocus = i;
    inName.classList.toggle('focused', i === 0);
    inUrl.classList.toggle('focused', i === 1);
    btnSave.classList.toggle('focused', i === 2);
    btnCancel.classList.toggle('focused', i === 3);
    if (i === 0) inName.focus();
    else if (i === 1) inUrl.focus();
    else if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  function saveDialog() {
    var name = inName.value.replace(/^\s+|\s+$/g, '');
    var url = inUrl.value.replace(/^\s+|\s+$/g, '');
    if (!name || !/^https?:\/\/.+\..+/.test(url)) return;
    var list = loadCustom();
    list.push({ name: name, url: url });
    saveCustom(list);
    closeDialog();
    render();
    focusIndex = items.length - 2;
    updateFocus();
  }

  function dialogKey(e) {
    var k = e.keyCode;
    var typing = dialogFocus <= 1;
    if (k === 10009 || k === 27) { // Return / Esc
      closeDialog();
      e.preventDefault();
      return;
    }
    if (k === 40) { // down
      setDialogFocus(Math.min(3, dialogFocus + 1));
      e.preventDefault();
    } else if (k === 38) { // up
      setDialogFocus(Math.max(0, dialogFocus - 1));
      e.preventDefault();
    } else if (k === 37 || k === 39) {
      if (!typing) {
        setDialogFocus(dialogFocus === 2 ? 3 : 2);
        e.preventDefault();
      }
    } else if (k === 13) {
      if (dialogFocus === 2) saveDialog();
      else if (dialogFocus === 3) closeDialog();
      else if (dialogFocus === 0) setDialogFocus(1);
      else setDialogFocus(2);
      e.preventDefault();
    }
  }

  /* ---------- global keys ---------- */
  function exitApp() {
    try {
      tizen.application.getCurrentApplication().exit();
    } catch (err) {
      window.close();
    }
  }

  document.addEventListener('keydown', function (e) {
    if (dialogOpen) {
      dialogKey(e);
      return;
    }
    switch (e.keyCode) {
      case 37: move(-1, 0); break;
      case 39: move(1, 0); break;
      case 38: move(0, -1); break;
      case 40: move(0, 1); break;
      case 13: openItem(); break;
      case 406: removeCurrent(); break; // Blue key
      case 10009: exitApp(); break;     // Return
      default: return;
    }
    e.preventDefault();
  });

  btnSave.addEventListener('click', saveDialog);
  btnCancel.addEventListener('click', closeDialog);

  // Register remote keys (safe if not on Tizen)
  try {
    tizen.tvinputdevice.registerKey('ColorF3Blue');
  } catch (err) { /* ignore */ }

  render();
})();

</script>
</body>
</html>
